# Deploy gutenberg to fly.io

name: Fly deploy
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable corepack
        shell: bash
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "yarn"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Checkout course material
        shell: bash
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r scripts/python_requirements.txt
          python scripts/pull_material.py
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: flyctl deploy --remote-only
          --build-arg DATABASE_URL=${{secrets.DATABASE_URL}}
          --build-arg NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{secrets.NEXT_PUBLIC_PLAUSIBLE_DOMAIN}}
          --build-arg NEXT_PUBLIC_PLAUSIBLE_HOST=${{secrets.NEXT_PUBLIC_PLAUSIBLE_HOST}}
          --wait-timeout 240
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
